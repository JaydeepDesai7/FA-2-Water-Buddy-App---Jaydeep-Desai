<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaterBuddy</title><meta name="theme-color" content="#04122e"><meta name="apple-mobile-web-app-capable" content="yes"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--nv:rgba(3,10,30,.62);--bg:radial-gradient(circle at 15% 10%,#1fb6ff55,transparent 40%),radial-gradient(circle at 85% 30%,#00e5c955,transparent 45%),radial-gradient(circle at 50% 100%,#0a6cff66,transparent 50%),linear-gradient(180deg,#04122e 0%,#06306b 55%,#0a5a8f 100%);--cd:#ffffff14;--tx:#e8fbff;--ac:#2ec4d6}
[data-t=space]{--bg:radial-gradient(circle at 20% 15%,#7c4dff66,transparent 40%),radial-gradient(circle at 80% 40%,#ff4fd855,transparent 45%),radial-gradient(circle at 50% 100%,#2a63ff44,transparent 50%),linear-gradient(180deg,#05030f,#140a3a 60%,#2b1260);--ac:#b388ff;--tx:#f1eaff}
[data-t=jungle]{--bg:radial-gradient(circle at 15% 10%,#b7f55a55,transparent 40%),radial-gradient(circle at 85% 35%,#2ee6a655,transparent 45%),radial-gradient(circle at 50% 100%,#0f7a3a88,transparent 50%),linear-gradient(180deg,#06281a,#0c5a2e 60%,#1b8a43);--ac:#9be564;--tx:#effbe8}
[data-t=candy]{--nv:rgba(255,255,255,.9);--bg:radial-gradient(circle at 15% 10%,#ff9ad566,transparent 45%),radial-gradient(circle at 85% 30%,#9ad7ff99,transparent 45%),radial-gradient(circle at 50% 100%,#ffe29a99,transparent 50%),linear-gradient(180deg,#fff0f8,#ffd9ef 55%,#d9ecff);--ac:#ff5fa2;--tx:#4a1a38;--cd:#ffffffb0}
[data-t=neon]{--bg:radial-gradient(circle at 15% 10%,#00f0ff44,transparent 40%),radial-gradient(circle at 85% 40%,#c400ff55,transparent 45%),radial-gradient(circle at 50% 100%,#ff2e9a44,transparent 50%),linear-gradient(180deg,#04010c,#0d0530 60%,#1a0848);--ac:#00f0ff;--tx:#f0f0ff}
[data-t=calm]{--nv:rgba(255,255,255,.9);--bg:radial-gradient(circle at 15% 10%,#cfe9e2,transparent 45%),radial-gradient(circle at 85% 35%,#dfe8f7,transparent 45%),linear-gradient(180deg,#f7f9f8,#e6eeec);--ac:#3f7f7a;--tx:#223333;--cd:#fff}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Fredoka,system-ui,sans-serif;background:var(--bg) fixed;color:var(--tx);min-height:100vh;transition:background .5s,color .5s}
main{max-width:520px;margin:auto;padding:14px 14px 120px}h1,h2,h3{margin:.4em 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);display:flex;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--nv);backdrop-filter:blur(20px) saturate(1.4);border-top:1px solid var(--ac);border-radius:24px 24px 0 0;z-index:50;box-shadow:0 -8px 30px #0004}nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.68rem;line-height:1.2;border:none;background:none;border-radius:16px}nav button span{font-size:1.35rem}nav button.on{background:var(--ac);color:#021}
.cta{width:100%;min-height:62px;font-size:1.2rem;font-weight:600;background:var(--ac);color:#021;border:none;box-shadow:0 10px 28px #0005;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 10px 44px var(--ac)}}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.wv{position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:-1;pointer-events:none;overflow:hidden}.wv svg{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:wvs 14s linear infinite}.wv .w2{height:75%;animation-duration:22s;animation-direction:reverse}@keyframes wvs{to{transform:translateX(-50%)}}
button,select,input{font:inherit;color:var(--tx);background:var(--cd);border:1.5px solid var(--ac);border-radius:14px;padding:10px 14px;min-height:44px;cursor:pointer;transition:.2s}
button:hover{background:var(--ac);color:#021;transform:translateY(-2px)}button:active{transform:scale(.96)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.on{background:var(--ac);color:#021}option{color:#000}
.card{background:var(--cd);border:1px solid #ffffff33;border-radius:24px;padding:14px 18px;margin:8px 0;backdrop-filter:blur(14px);box-shadow:0 8px 32px #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.c{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:10px;border-radius:6px;background:#8884;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .6s}
.sw{border:3px solid var(--ac);border-radius:14px;padding:12px;text-align:center;font-weight:600}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ac);color:#021;padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.s{opacity:1}
.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes wv{to{transform:translateX(-80px)}}@keyframes rise{to{transform:translateY(-190px);opacity:0}}
@keyframes sp{to{transform:translate(var(--x),-120px) scale(0);opacity:0}}.spk{position:fixed;left:50%;top:50%;animation:sp 1s ease-out forwards;pointer-events:none;font-size:22px}
.red *{animation:none!important;transition:none!important}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 20%,var(--ac),transparent 35%),radial-gradient(circle at 80% 70%,var(--ac),transparent 30%);opacity:.18;animation:dr 22s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(6%,4%) scale(1.15)}}
#pl{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.pt{position:absolute;bottom:-40px;left:var(--l);font-size:var(--s);opacity:.35;color:var(--ac);animation:pr var(--d) linear infinite;animation-delay:var(--w)}
@keyframes pr{to{transform:translateY(-115vh) rotate(360deg)}}@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.pg{animation:pin .5s both}.card{transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px #0004}
.logo{font-size:2.1rem;font-weight:600;background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200%}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:none}96%{transform:scaleY(.1)}}
.bnc{display:inline-block;animation:bn .8s 3}@keyframes bn{0%,100%{transform:none}30%{transform:translateY(-34px) scale(1.08,.92)}60%{transform:scale(.92,1.08)}}
@keyframes fill{from{transform:translateY(var(--d))}}@keyframes ring{from{stroke-dasharray:var(--f) 327}}
.rp{position:fixed;width:90px;height:90px;margin:-45px;border:3px solid var(--ac);border-radius:50%;animation:rp 1.1s ease-out forwards;pointer-events:none}@keyframes rp{from{transform:scale(.2);opacity:.9}to{transform:scale(2.4);opacity:0}}
.cf{position:fixed;left:50%;top:45%;width:10px;height:14px;border-radius:3px;animation:cf 1.6s ease-out forwards;pointer-events:none;z-index:20}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}
</style></head><body><div id="pl" aria-hidden="true"></div><div class="wv" aria-hidden="true"><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60Q150 20 300 60T600 60T900 60T1200 60V120H0z" fill="var(--ac)" opacity=".2"/></svg><svg class="w2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70Q150 30 300 70T600 70T900 70T1200 70V120H0z" fill="var(--ac)" opacity=".14"/></svg></div><main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<script>
const TH={ocean:"Ocean Explorer",space:"Space Adventure",jungle:"Jungle Quest",candy:"Candy Pop",neon:"Neon Night",calm:"Calm Minimal"};
const BD={Aqua:["#4cc9f0","#0077b6","The original friendly drop."],Bubbles:["#8ecae6","#219ebc","A playful ocean companion."],Coral:["#ffb4a2","#e5707e","An underwater explorer."],Splash:["#48cae4","#0096c7","Energetic and cheerful."],Nova:["#9d8cff","#4a2fbd","A cosmic water explorer."],Leaf:["#95d5b2","#2d6a4f","Calm and nature-inspired."]};
const ACC={Aqua:"",Bubbles:'<circle cx="26" cy="40" r="10" fill="#fff" opacity=".5"/><circle cx="136" cy="56" r="7" fill="#fff" opacity=".5"/>',Coral:'<path d="M60 40l-10-22M60 40l12-18M100 40l-12-20M100 40l12-22" stroke="#ff7f7f" stroke-width="6" stroke-linecap="round"/>',Splash:'<path d="M20 50l14 10M140 50l-14 10M80 6v14" stroke="#fff" stroke-width="5" stroke-linecap="round"/>',Nova:'<ellipse cx="80" cy="110" rx="74" ry="14" fill="none" stroke="#ffd166" stroke-width="4"/>',Leaf:'<path d="M80 22c20-24 44-14 46-12-2 22-22 36-46 12z" fill="#52b788"/>'};
const AG={"Kids (6-9)":1200,"Pre-teens (10-13)":1500,"Teens (14-17)":1800,"Adults (18+)":2000};
const MS=[["first","Log your first drink",()=>[Math.min(S.e.length,1),1]],["three","Record 3 drinks today",()=>[Math.min(S.e.length,3),3]],["half","Reach 50% of your goal",()=>[+(pct()>=50),1]],["theme","Explore a new theme",()=>[+!!S.fl.theme,1]],["sum","Review the daily summary",()=>[+!!S.fl.sum,1]],["goal","Reach your goal",()=>[+(pct()>=100),1]]];
const DEST=[["Ocean Reef","ocean","Sunlit coral and gentle currents."],["Cosmic Lagoon","space","A glittering pool among the stars."],["Jungle Springs","jungle","Mossy pools under giant leaves."],["Candy Cove","candy","A sugar-sweet bay of pastel waves."],["Neon Atlantis","neon","A glowing sunken city after dark."],["Peaceful Falls","calm","A quiet waterfall. No rush here."]];
const PG=[["dash","Home","🏠","Dashboard"],["adv","Quest","🧭","Hydration Adventure"],["fun","Fun","🎮","Fun Zone"],["hist","Stats","📈","Progress and history"],["sum","Day","📅","Daily summary"],["set","Settings","⚙️","Settings"]];
const today=()=>new Date().toDateString();
let S={step:0,age:"Adults (18+)",goal:2000,buddy:"Aqua",theme:"ocean",page:"dash",dest:null,e:[],aw:[],bd:[],fl:{},hist:[],rm:{on:false,iv:60,s:8,e:20,last:0},red:false,day:today()},mood="happy";
try{Object.assign(S,JSON.parse(localStorage.getItem("wb1")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("wb1",JSON.stringify(S))}catch(e){}};
const tot=()=>S.e.reduce((a,b)=>a+b.ml,0),pct=()=>S.goal>0?tot()/S.goal*100:0,rem=()=>S.goal>0?Math.max(0,S.goal-tot()):0,cap=p=>Math.max(0,Math.min(100,p));
const ms=()=>[25,50,75,100].filter(m=>pct()>=m);
const snap=()=>({date:S.day,total:tot(),goal:S.goal,pct:Math.round(pct()),n:S.e.length,ms:ms(),badges:S.bd.length});
function newDay(){if(S.e.length)S.hist.push(snap());S.e=[];S.aw=[];S.day=today();mood="happy";}
if(S.day!==today())newDay();
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.className="s";setTimeout(()=>e.className="",2600)}
function spark(){if(S.red)return;for(let i=0;i<28;i++){const s=document.createElement("span");s.className="cf";s.style.cssText=`--x:${i*53%420-210}px;--y:${-(120+i*29%260)}px;background:hsl(${i*37%360},90%,60%);animation-delay:${i%5*.04}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),1800)}}
function rip(){if(S.red)return;const b=document.querySelector('svg[aria-label^="Bottle"]');if(!b)return;const r=b.getBoundingClientRect();for(let i=0;i<2;i++){const e=document.createElement("span");e.className="rp";e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height*.6}px;animation-delay:${i*.25}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}}
function pf(){const a=document.getElementById("app");a.classList.remove("pg");void a.offsetWidth;a.classList.add("pg")}
function cu(){document.querySelectorAll("[data-n]").forEach(e=>{if(S.red)return;const a=+e.dataset.p,b=+e.dataset.n,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1000);e.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function chk(){MS.forEach(([k,t,f])=>{const[c,n]=f();if(c>=n&&!S.bd.includes(k)){S.bd.push(k);toast("Badge earned: "+t+"!")}})}
function log(v){const ml=Math.floor(Number(v));if(!(ml>=1&&ml<=2000)){toast("Enter a whole number from 1 to 2000 ml");return}
S.e.push({ml,t:Date.now()});const nw=[25,50,75,100].filter(m=>pct()>=m&&!S.aw.includes(m));S.aw.push(...nw);
mood=nw.includes(100)?"party":"cheer";toast(nw.length?S.buddy+": "+Math.max(...nw)+"% reached! Nice work.":"+"+ml+" ml. "+S.buddy+" is happy!");if(nw.length)spark();chk();sv();R();rip()}
function del(i){S.e.splice(i,1);S.aw=ms();mood="happy";toast("Entry removed. Totals updated.");sv();R()}
function go(p){S.page=p;S.dest=null;if(p==="sum"){S.fl.sum=1;chk()}sv();R();pf()}
function setT(t){if(t!==S.theme)S.fl.theme=1;S.theme=t;chk();sv();R()}
function setB(b){S.buddy=b;mood="cheer";sv();R()}
function buddy(n,m,sz=130){const[a,b]=BD[n],g=m!=="happy";return`<svg class="fl" width="${sz}" height="${sz}" viewBox="0 0 160 160" role="img" aria-label="${n} buddy"><defs><linearGradient id="g${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>${ACC[n]}<path d="M80 18C80 18 30 74 30 105a50 50 0 0 0 100 0C130 74 80 18 80 18z" fill="url(#g${n})"/>${g?'<path d="M62 78q6-8 12 0M86 78q6-8 12 0" stroke="#012" stroke-width="3" fill="none"/><path d="M68 95q12 16 24 0z" fill="#012"/>':'<circle class="eye" cx="68" cy="78" r="5" fill="#012"/><circle class="eye" cx="92" cy="78" r="5" fill="#012"/><path d="M70 96q10 9 20 0" stroke="#012" stroke-width="3" fill="none"/>'}</svg>`}
function bottle(f){const y=40+230*(1-f/100),dy=230*(f-pv.f)/100;return`<svg viewBox="0 0 160 300" width="160" role="img" aria-label="Bottle ${Math.round(f)}% full"><defs><clipPath id="bc"><rect x="30" y="40" width="100" height="230" rx="28"/></clipPath></defs><rect x="62" y="8" width="36" height="34" rx="8" fill="var(--ac)"/><g clip-path="url(#bc)"><g style="--d:${dy}px;animation:fill 1.4s cubic-bezier(.22,.9,.3,1)"><rect x="0" y="${y}" width="200" height="300" fill="var(--ac)" opacity=".7" style="transition:y .8s"/><path d="M-80 ${y}q20-10 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0V${y+14}H-80z" fill="var(--ac)" style="animation:wv 3s linear infinite"/></g>${[[60,4,4],[90,3,5],[110,5,6]].map(([x,r,d])=>`<circle cx="${x}" cy="262" r="${r}" fill="#fff" opacity=".6" style="animation:rise ${d}s linear infinite"/>`).join("")}</g><rect x="30" y="40" width="100" height="230" rx="28" fill="none" stroke="var(--tx)" stroke-width="3" opacity=".7"/></svg>`}
function ring(p){const c=2*Math.PI*52;return`<svg viewBox="0 0 140 140" width="160" role="img" aria-label="${Math.round(p)} percent"><circle cx="70" cy="70" r="52" stroke="var(--tx)" opacity=".2" stroke-width="12" fill="none"/><circle cx="70" cy="70" r="52" stroke="var(--ac)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${c*cap(p)/100} ${c}" transform="rotate(-90 70 70)" style="--f:${c*pv.f/100};animation:ring 1.2s ease-out;filter:drop-shadow(0 0 6px var(--ac))"/><text x="70" y="78" text-anchor="middle" font-size="24" font-weight="700" fill="var(--tx)">${Math.round(p)}%</text></svg>`}
const sw=t=>`<div class="sw" data-t="${t}" style="background:var(--bg);color:var(--tx)">${TH[t]}<div style="height:8px;border-radius:6px;background:var(--ac);margin-top:6px"></div></div>`;
const themeGrid=()=>`<div class="grid">${Object.keys(TH).map(t=>`<div>${sw(t)}<button style="width:100%;margin-top:4px" class="${S.theme===t?"on":""}" onclick="setT('${t}')">${S.theme===t?"✔ Active":"Use"}</button></div>`).join("")}</div>`;
const buddyGrid=d=>`<div class="grid">${Object.keys(BD).map(n=>`<div class="c">${buddy(n,S.buddy===n?"cheer":"happy",80)}<button style="width:100%" class="${S.buddy===n?"on":""}" onclick="setB('${n}')">${n}</button>${d?`<small>${BD[n][2]}</small>`:""}</div>`).join("")}</div>`;
let lt,pv={t:0,f:0};const GL={ocean:"○",space:"✦",jungle:"❦",candy:"●",neon:"✚",calm:"·"};
function parts(){document.getElementById("pl").innerHTML=S.red?"":Array.from({length:18},(_,i)=>`<span class="pt" style="--l:${i*37%100}%;--s:${14+i*7%22}px;--d:${12+i*5%14}s;--w:-${i*3%12}s">${GL[S.theme]}</span>`).join("")}
function R(){document.body.dataset.t=S.theme;if(lt!==S.theme+S.red){lt=S.theme+S.red;parts()}document.body.className=S.red?"red":"";const a=document.getElementById("app");
if(S.step<4){a.innerHTML=[`<div class="c">${buddy(S.buddy,"cheer",180)}<h1>WaterBuddy</h1><h2>Make every sip an adventure.</h2><p>Meet your water buddy, track your progress, and turn hydration into a habit.</p><button class="on" onclick="S.step=1;R()">Start</button></div>`,
`<h2>Who is using WaterBuddy?</h2><div class="grid">${Object.keys(AG).map(k=>`<button class="${S.age===k?"on":""}" onclick="S.age='${k}';S.goal=AG['${k}'];R()">${k}</button>`).join("")}</div><p><button class="on" onclick="S.step=2;R()">Next</button></p>`,
`<h2>Your daily tracking goal</h2><p>A starting point for tracking, not a medical recommendation. Needs vary with health, activity and weather. Younger users should choose with a parent or guardian.</p><label>Goal (ml) <input type="number" min="500" max="6000" step="50" value="${S.goal}" onchange="S.goal=Math.max(500,Math.min(6000,+this.value||2000));R()"></label><p>${S.goal} ml = ${(S.goal/1000).toFixed(2)} L</p><button class="on" onclick="S.step=3;R()">Next</button>`,
`<h2>Choose your buddy</h2>${buddyGrid(1)}<p><button class="on" onclick="S.step=4;sv();R()">Enter WaterBuddy</button></p>`][S.step];sv();return}
const p=pct(),t=tot();let h=`<div class="logo">💧 WaterBuddy</div>${S.page==="dash"?`<p style="margin:-4px 0 8px;opacity:.9">${new Date().getHours()<12?"Good morning":new Date().getHours()<18?"Good afternoon":"Good evening"}! ${rem()} ml to go today.</p>`:""}<nav aria-label="Main">${PG.map(([k,n,i,f])=>`<button class="${S.page===k?"on":""}" aria-label="${f}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join("")}</nav>`;
if(S.page==="dash"){h+=`<div class="grid c"><div><div class="${mood!=="happy"?"bnc":""}">${buddy(S.buddy,mood)}</div></div><div>${bottle(cap(p))}</div><div>${ring(p)}</div></div>${S.e.length?"":`<div class="card">Hi, I'm ${S.buddy}! Log your first drink whenever you're ready.</div>`}
${p>100?`<p>Goal reached (${Math.round(p)}%). There's no need to drink more.</p>`:""}
<button class="cta" onclick="log(250)">💧 Drink 250 ml</button><div class="grid4">${[100,150,350,500].map(n=>`<button onclick="log(${n})">+${n}</button>`).join("")}</div><div class="row" style="margin-top:8px"><input id="cu" type="number" min="1" max="2000" value="200" aria-label="Custom amount in ml" style="flex:1;min-width:90px"><button onclick="log(document.getElementById('cu').value)">Add custom</button>${S.e.length?`<button onclick="del(${S.e.length-1})">↩ Undo</button>`:""}</div><div class="grid c"><div class="card"><b><i data-n="${t}" data-p="${pv.t}">${t}</i> ml</b><br>logged</div><div class="card"><b>${S.goal} ml</b><br>goal</div><div class="card"><b><i data-n="${rem()}" data-p="${Math.max(0,S.goal-pv.t)}">${rem()}</i> ml</b><br>remaining</div><div class="card"><b>${S.e.length}</b><br>drinks</div><div class="card"><b>${ms().slice(-1)[0]||"None"}${ms().length?"%":""}</b><br>milestone</div></div><h3>Today's timeline</h3>${S.e.length?S.e.map((e,i)=>`<div class="card row">${new Date(e.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})} · ${e.ml} ml <button onclick="del(${i})" style="margin-left:auto">Remove</button></div>`).reverse().join(""):"<p>No drinks logged yet.</p>"}`}
else if(S.page==="adv"){if(S.dest===null)h+=`<h2>Adventure map</h2><p>Every destination is open. Rewards are optional.</p><div class="grid">${DEST.map(([n,t,d],i)=>{const[c,k]=MS[i][2]();return`<div>${sw(t)}<button style="width:100%;margin-top:4px" onclick="S.dest=${i};R()">Open ${n} (${c}/${k})</button></div>`}).join("")}</div>`;
else{const[n,t,d]=DEST[S.dest],[c,k]=MS[S.dest][2]();h+=`<h2>${n}</h2>${sw(t)}<p>${d}</p><div class="card"><b>Mission: ${MS[S.dest][1]}</b><br>${c} of ${k} complete<div class="bar"><i style="width:${c/k*100}%"></i></div></div><button onclick="S.dest=null;R()">Back to map</button>`}}
else if(S.page==="fun")h+=`<h2>Pick a buddy</h2>${buddyGrid()}<h2>Pick a theme</h2>${themeGrid()}<h2>Missions and badges</h2>${MS.map(([k,n,f])=>{const[c,m]=f();return`<div class="card">${S.bd.includes(k)?"🏅":"▫️"} ${n}: ${c} of ${m}<div class="bar"><i style="width:${c/m*100}%"></i></div></div>`}).join("")}`;
else if(S.page==="hist")h+=`<h2>Progress and history</h2>${S.hist.length?S.hist.slice().reverse().map(d=>`<div class="card"><b>${d.date}</b>: ${d.total} of ${d.goal} ml (${d.pct}%), ${d.n} drinks</div>`).join(""):"<p>Finished days appear here after you start a new day.</p>"}`;
else if(S.page==="sum"){const d=snap();h+=`<h2>Daily summary</h2><div class="card">Total: <b>${d.total} ml</b> of ${d.goal} ml (${d.pct}%)<br>Entries: ${d.n}<br>Milestones: ${d.ms.map(m=>m+"%").join(", ")||"none yet"}<br>Badges: ${d.badges}</div><p>${d.pct<100?"Every day is a fresh start. Thanks for taking care of yourself.":"Goal reached. Great job today!"}</p><button onclick="if(confirm('Save today to History and clear today\\'s drinks? Theme, buddy and reminders are kept.')){newDay();sv();toast('New day started.');R()}">Start a new day</button>`}
else h+=`<h2>Settings</h2><div class="card"><label>Age group <select onchange="S.age=this.value;R()">${Object.keys(AG).map(k=>`<option ${k===S.age?"selected":""}>${k}</option>`).join("")}</select></label> <button onclick="S.goal=AG[S.age];R()">Use suggested goal (${AG[S.age]} ml)</button><p><label>Daily goal (ml) <input type="number" min="500" max="6000" step="50" value="${S.goal}" onchange="S.goal=Math.max(500,Math.min(6000,+this.value||2000));R()"></label></p>
<label>Buddy <select onchange="setB(this.value)">${Object.keys(BD).map(k=>`<option ${k===S.buddy?"selected":""}>${k}</option>`).join("")}</select></label> <label>Theme <select onchange="setT(this.value)">${Object.keys(TH).map(k=>`<option value="${k}" ${k===S.theme?"selected":""}>${TH[k]}</option>`).join("")}</select></label>
<p><label><input type="checkbox" ${S.red?"checked":""} onchange="S.red=this.checked;R()"> Reduced motion</label></p></div>
<div class="card"><h3>Reminders</h3><label><input type="checkbox" ${S.rm.on?"checked":""} onchange="S.rm.on=this.checked;S.rm.last=Date.now();sv();R()"> Enable reminders</label> <label>Every <select onchange="S.rm.iv=+this.value;sv()">${[30,60,90,120].map(v=>`<option ${v===S.rm.iv?"selected":""}>${v}</option>`).join("")}</select> min</label> <label>From <input type="number" min="0" max="23" value="${S.rm.s}" style="width:70px" onchange="S.rm.s=+this.value;sv()"></label> <label>to <input type="number" min="1" max="24" value="${S.rm.e}" style="width:70px" onchange="S.rm.e=+this.value;sv()"></label>
<p><button onclick="notif(true)">Enable and test notification</button> <span id="np">Permission: ${window.Notification?Notification.permission:"unsupported"}</span></p><small>Browser notifications only work while this page is open. Reliable background reminders need a service worker on a secure hosted site; a local file cannot do this.</small></div>
<div class="card"><h3>Data</h3><button onclick="exp()">Export JSON</button> <button onclick="if(confirm('Delete ALL WaterBuddy data in this browser?')){localStorage.removeItem('wb1');location.reload()}">Reset all data</button><p><small>Progress is saved only in this browser (localStorage), never synced. WaterBuddy is a habit tracker, not a medical device. Hydration needs vary; follow your healthcare professional's advice.</small></p></div>`;
a.innerHTML=h;if(S.page==="dash"){cu();pv={t,f:cap(p)};mood="happy"}sv()}
function notif(t){if(!window.Notification){toast("Notifications not supported");return}Notification.requestPermission().then(p=>{const e=document.getElementById("np");if(e)e.textContent="Permission: "+p;if(p==="granted"&&t)new Notification("WaterBuddy",{body:"Time for a sip, only if you like!"})})}
function exp(){const u=URL.createObjectURL(new Blob([JSON.stringify({today:snap(),history:S.hist},null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download="waterbuddy.json";a.click()}
setInterval(()=>{const r=S.rm,n=new Date();if(S.step<4||!r.on||n.getHours()<r.s||n.getHours()>=r.e)return;const last=Math.max(r.last||0,S.e.length?S.e[S.e.length-1].t:0);
if(Date.now()-last>=r.iv*60000){r.last=Date.now();sv();toast("Gentle nudge: a sip when you feel like it!");if(window.Notification&&Notification.permission==="granted")new Notification("WaterBuddy",{body:"A sip when you feel like it!"})}},30000);
R();
